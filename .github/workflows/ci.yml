name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pactora-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pactora:pactora@localhost:5432/pactora?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://pactora:pactora@localhost:5432/pactora?schema=public
          SESSION_SECRET: ci-placeholder-only-not-a-real-secret
          DEMO_MODE: "true"
