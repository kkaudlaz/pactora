services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pactora
      POSTGRES_USER: pactora
      POSTGRES_PASSWORD: local-dev-only-change-me
    ports:
      - "5432:5432"
    volumes:
      - pactora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pactora -d pactora"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pactora-postgres:
